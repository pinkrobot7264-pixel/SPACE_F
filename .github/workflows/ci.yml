name: CI

on: [push, pull_request]

jobs:
  # Phase 1 §11.2: the conformance suite runs with **no WinFsp installed and no
  # mount**. Kept as a separate job on a runner where WinFsp is deliberately
  # absent, so the property is enforced rather than asserted.
  #
  # If this job ever needs WinFsp, something leaked from the adapter into the
  # core -- which is exactly the regression it exists to catch. It also means a
  # contract failure points at logic rather than at a drive letter, Explorer or
  # the kernel.
  conformance-no-winfsp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Assert WinFsp is NOT installed
        shell: pwsh
        run: |
          # The whole point of this job. If a future runner image ships WinFsp,
          # fail loudly rather than silently proving nothing.
          foreach ($p in @(
            "C:\Program Files (x86)\WinFsp\inc\winfsp\winfsp.h",
            "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll")) {
            if (Test-Path $p) {
              throw "WinFsp is present at $p; this job must run without it (manual 11.2)"
            }
          }
          Write-Host "WinFsp absent, as required"

      # Only the core crate: client/main links the C++ adapter and therefore
      # needs the WinFsp SDK. The core, the VFS contract and the whole
      # conformance suite must not.
      - name: Build the core without WinFsp
        run: cargo build -p space-client-core --all-targets

      - name: Conformance suite, no mount
        run: cargo test -p space-client-core

      - name: Conformance suite in release (ADR-0013 panic model)
        run: cargo test -p space-client-core --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WinFsp
        run: choco install winfsp -y --no-progress

      - name: Verify WinFsp developer files
        shell: pwsh
        run: |
          foreach ($p in @(
            "C:\Program Files (x86)\WinFsp\inc\winfsp\winfsp.h",
            "C:\Program Files (x86)\WinFsp\lib\winfsp-x64.lib")) {
            if (-not (Test-Path $p)) { throw "WinFsp developer files missing: $p" }
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (debug)
        run: cargo build --workspace

      - name: Test
        run: cargo nextest run --workspace

      - name: Release build
        run: cargo build --workspace --release

      - name: Release build must not enable fault injection
        shell: pwsh
        run: |
          $tree = cargo tree --workspace --edges features 2>&1 | Out-String
          if ($tree -match "fault-injection") { throw "fault-injection feature enabled" }

      # MSVC on PATH so Ninja invokes cl.exe, never MinGW (docs/runbooks/ci.md).
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: C++ WinFsp adapter (MSVC + Ninja)
        shell: pwsh
        run: |
          where.exe cl
          cmake -B build -S . -G Ninja
          cmake --build build

      - name: Secret scan
        shell: pwsh
        run: |
          choco install gitleaks -y --no-progress
          gitleaks detect --no-banner --redact
