[workspace]
resolver = "2"
members = [
    "contracts",
    "objectstore",
    "faults",
    "client/core",
    "client/config",
    "client/main",
    "cloud/api",
    "cloud/auth",
    "cloud/metadata",
    "cloud/manifests",
    "cloud/versions",
    "cloud/chunks",
    "cloud/database",
    "tests/harness",
    "tests/generators",
    "tests/suites",
    "tools/corruptor",
    "tools/fixturegen",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
contracts = { path = "contracts" }
objectstore = { path = "objectstore" }
faults = { path = "faults" }
space-config = { path = "client/config" }
space-client-core = { path = "client/core" }
space-cloud-metadata = { path = "cloud/metadata" }
space-cloud-api = { path = "cloud/api" }
space-generators = { path = "tests/generators" }
space-corruptor = { path = "tools/corruptor" }
space-test-harness = { path = "tests/harness" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
debug = 1         # keep symbols for crash-dump analysis
panic = "abort"
